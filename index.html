<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<title>Sana...</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Quicksand:wght@400;500;600;700&display=swap');

  :root{
    --bg1:#ffe3ec;
    --bg2:#ffc4d9;
    --card:#fff8fa;
    --ink:#5c2a40;
    --rose:#e8527a;
    --gold:#f2b25c;
  }

  *{ box-sizing:border-box; }

  body{
    margin:0;
    min-height:100vh;
    background: radial-gradient(circle at 20% 15%, var(--bg1), var(--bg2) 70%);
    font-family:'Quicksand', sans-serif;
    color:var(--ink);
    overflow-x:hidden;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:32px 16px;
    position:relative;
  }

  #hearts{
    position:fixed; inset:0; pointer-events:none; z-index:0;
  }

  .card{
    position:relative;
    z-index:1;
    background:var(--card);
    border-radius:28px;
    max-width:480px;
    width:100%;
    padding:40px 32px 36px;
    box-shadow:0 25px 60px -20px rgba(232,82,122,0.45);
    border:1px solid rgba(232,82,122,0.15);
  }

  .names{
    text-align:center;
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:1.5rem;
    letter-spacing:0.03em;
    color:var(--gold);
    margin:0 0 8px;
  }

  h1{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:2.4rem;
    text-align:center;
    margin:14px 0 6px;
    color:var(--rose);
  }

  .subtitle{
    text-align:center;
    font-size:0.85rem;
    letter-spacing:0.08em;
    text-transform:uppercase;
    color:#b56683;
    margin-bottom:28px;
  }

  ul.love-list{
    list-style:none;
    margin:0 0 32px;
    padding:0;
    display:flex;
    flex-direction:column;
    gap:14px;
  }

  ul.love-list li{
    background:#fff;
    border-radius:16px;
    padding:14px 18px;
    font-size:1.02rem;
    line-height:1.4;
    border-left:4px solid var(--gold);
    box-shadow:0 4px 14px -8px rgba(92,42,64,0.3);
  }

  .music-row{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    margin-bottom:28px;
    font-size:0.9rem;
    color:#8a4a63;
  }

  audio{
    width:100%;
    max-width:280px;
    height:34px;
  }

  .kiss-btn{
    display:block;
    margin:0 auto;
    background:linear-gradient(135deg, var(--rose), #c93866);
    color:#fff;
    border:none;
    padding:16px 34px;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:1.05rem;
    letter-spacing:0.02em;
    cursor:pointer;
    box-shadow:0 12px 24px -8px rgba(201,56,102,0.6);
    transition:transform 0.15s ease, box-shadow 0.15s ease;
  }

  .kiss-btn:active{
    transform:scale(0.94);
    box-shadow:0 6px 14px -6px rgba(201,56,102,0.6);
  }

  .hug-btn{
    display:block;
    margin:14px auto 0;
    background:#fff;
    color:var(--rose);
    border:2px solid var(--rose);
    padding:14px 30px;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .hug-btn:hover{ background:var(--rose); color:#fff; }
  .hug-btn:active{ transform:scale(0.94); }

  .angry-btn{
    display:block;
    margin:14px auto 0;
    background:#fff;
    color:#c98a2e;
    border:2px solid var(--gold);
    padding:14px 30px;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:1rem;
    cursor:pointer;
    transition:transform 0.15s ease, background 0.15s ease, color 0.15s ease;
  }

  .angry-btn:hover{ background:var(--gold); color:#fff; }
  .angry-btn:active{ transform:scale(0.94); }

  .angry-box{
    margin-top:20px;
    text-align:center;
  }

  .angry-q{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-size:1.3rem;
    color:var(--ink);
    margin:0 0 14px;
  }

  .angry-choices{
    display:flex;
    align-items:center;
    justify-content:center;
    gap:16px;
    flex-wrap:wrap;
  }

  .angry-yes{
    background:#fff;
    color:#a0a0a0;
    border:2px solid #d8d0d4;
    padding:10px 22px;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    cursor:pointer;
  }

  .angry-no{
    background:linear-gradient(135deg, var(--rose), #c93866);
    color:#fff;
    border:none;
    padding:10px 22px;
    border-radius:999px;
    font-family:'Quicksand', sans-serif;
    font-weight:700;
    font-size:0.95rem;
    cursor:pointer;
    transition:transform 0.25s ease;
    transform-origin:center;
  }

  .angry-msg{
    margin-top:28px;
    padding:0 8px;
    font-size:1.05rem;
    line-height:1.5;
    color:#b56683;
    min-height:24px;
  }

  .hug-screen{
    position:relative;
    z-index:1;
    text-align:center;
  }

  .hug-screen h2{
    font-family:'Cormorant Garamond', serif;
    font-style:italic;
    font-weight:600;
    font-size:2rem;
    color:var(--rose);
    margin:0 0 18px;
  }

  .bear-wrap{
    animation: hugSway 2.6s ease-in-out infinite;
    transform-origin:center bottom;
    filter:drop-shadow(0 18px 30px rgba(92,42,64,0.35));
  }

  @keyframes hugSway{
    0%, 100%{ transform:rotate(-1.5deg) translateY(0); }
    50%{ transform:rotate(1.5deg) translateY(-4px); }
  }

  .back-btn{
    display:block;
    margin:22px auto 0;
    background:none;
    border:none;
    color:#b56683;
    font-family:'Quicksand', sans-serif;
    font-weight:600;
    font-size:0.95rem;
    text-decoration:underline;
    cursor:pointer;
  }

  @media (prefers-reduced-motion: reduce){
    .bear-wrap{ animation:none; }
  }

  .kiss-emoji{
    position:fixed;
    font-size:1.8rem;
    pointer-events:none;
    z-index:5;
    animation: floatUp 1.6s ease-out forwards;
  }

  @keyframes floatUp{
    0%{ transform:translateY(0) rotate(0deg) scale(0.6); opacity:0; }
    15%{ opacity:1; }
    100%{ transform:translateY(calc(-1 * var(--dist, 220px))) rotate(var(--rot,20deg)) scale(1.1); opacity:0; }
  }

  @media (prefers-reduced-motion: reduce){
    .kiss-emoji{ animation:none; opacity:0; }
    #hearts canvas{ display:none; }
  }
</style>
</head>

  const ctx = canvas.getContext('2d');
  function resize(){ canvas.width = innerWidth; canvas.height = innerHeight; }
  resize();
  window.addEventListener('resize', resize);

  const hearts = Array.from({length: 22}, () => ({
    x: Math.random() * innerWidth,
    y: Math.random() * innerHeight + innerHeight,
    size: 10 + Math.random() * 18,
    speed: 0.4 + Math.random() * 0.8,
    drift: (Math.random() - 0.5) * 0.6,
    opacity: 0.15 + Math.random() * 0.35
  }));

  function drawHeart(x, y, size, opacity){
    ctx.save();
    ctx.translate(x, y);
    ctx.beginPath();
    const s = size / 16;
    ctx.moveTo(0, 4*s);
    ctx.bezierCurveTo(0, 2*s, -6*s, -4*s, -8*s, 0);
    ctx.bezierCurveTo(-10*s, 5*s, -2*s, 9*s, 0, 13*s);
    ctx.bezierCurveTo(2*s, 9*s, 10*s, 5*s, 8*s, 0);
    ctx.bezierCurveTo(6*s, -4*s, 0, 2*s, 0, 4*s);
    ctx.closePath();
    ctx.fillStyle = `rgba(232, 82, 122, ${opacity})`;
    ctx.fill();
    ctx.restore();
  }

  function animate(){
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    for(const h of hearts){
      h.y -= h.speed;
      h.x += h.drift;
      if(h.y < -20){
        h.y = innerHeight + 20;
        h.x = Math.random() * innerWidth;
      }
      drawHeart(h.x, h.y, h.size, h.opacity);
    }
    requestAnimationFrame(animate);
  }
  animate();

  // ---- kiss button burst ----
  const emojis = ['💋','😘','💕','💗'];
  document.getElementById('kissBtn').addEventListener('click', (e) => {
    const rect = e.target.getBoundingClientRect();
    for(let i = 0; i < 8; i++){
      const el = document.createElement('div');
      el.className = 'kiss-emoji';
      el.textContent = emojis[Math.floor(Math.random() * emojis.length)];
      const startX = rect.left + rect.width/2 + (Math.random() - 0.5) * 80;
      const startY = rect.top + (Math.random() - 0.5) * 20;
      el.style.left = startX + 'px';
      el.style.top = startY + 'px';
      el.style.setProperty('--rot', (Math.random() * 40 - 20) + 'deg');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 1700);
    }
  });

  // ---- hug screen toggle ----
  const card = document.querySelector('.card');
  const hugScreen = document.getElementById('hugScreen');
  document.getElementById('hugBtn').addEventListener('click', () => {
    card.style.display = 'none';
    hugScreen.style.display = 'block';
  });
  document.getElementById('backBtn').addEventListener('click', () => {
    hugScreen.style.display = 'none';
    card.style.display = 'block';
  });

  // ---- "bana kızgın mısın?" toggle ----
  const angryBtn = document.getElementById('angryBtn');
  const angryBox = document.getElementById('angryBox');
  const angryYes = document.getElementById('angryYes');
  const angryNo = document.getElementById('angryNo');
  const angryMsg = document.getElementById('angryMsg');

  angryBtn.addEventListener('click', () => {
    angryBox.style.display = angryBox.style.display === 'none' ? 'block' : 'none';
  });

  let noScale = 1;
  const yesMessages = [
    'yanlış cevap, tekrar dene 😅',
    'olmaz öyle, bi daha bak 🥹',
    'hı hı, inanmadım 👀',
    'son şansın, düşün taşın 😌'
  ];
  angryYes.addEventListener('click', () => {
    noScale = Math.min(noScale + 0.3, 3);
    angryNo.style.transform = `scale(${noScale})`;
    angryMsg.textContent = yesMessages[Math.min(Math.floor((noScale - 1) / 0.3) - 1, yesMessages.length - 1)];
  });

  angryNo.addEventListener('click', () => {
    angryMsg.textContent = 'çok sevindim, seni çok seviyorum 🥹💕';
    noScale = 1;
    angryNo.style.transform = 'scale(1)';
    heartShower();
  });

  function heartShower(){
    const heartEmojis = ['❤️','💕','💖','💗','💓'];
    const weightedEmojis = [
      ...Array(2000).fill(null).map(() => heartEmojis[Math.floor(Math.random() * heartEmojis.length)]),
      ...Array(2000).fill('🌷')
    ];
    for(let i = weightedEmojis.length - 1; i > 0; i--){
      const j = Math.floor(Math.random() * (i + 1));
      [weightedEmojis[i], weightedEmojis[j]] = [weightedEmojis[j], weightedEmojis[i]];
    }
    weightedEmojis.forEach((emoji, i) => {
      setTimeout(() => {
        const el = document.createElement('div');
        el.className = 'kiss-emoji';
        el.textContent = emoji;
        el.style.left = Math.random() * innerWidth + 'px';
        el.style.top = innerHeight + 20 + 'px';
        el.style.fontSize = (1.2 + Math.random() * 1.6) + 'rem';
        el.style.setProperty('--rot', (Math.random() * 60 - 30) + 'deg');
        el.style.setProperty('--dist', (innerHeight + 100) + 'px');
        el.style.animationDuration = (1.4 + Math.random() * 1.2) + 's';
        document.body.appendChild(el);
        setTimeout(() => el.remove(), 3000);
      }, i * 3);
    });
  }
</script>

</body>
</html>
