<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Senin İçin Küçük Bir Sürpriz 💕</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Pacifico&family=Poppins:wght@300;400;600;700&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <!-- Animated background elements -->
    <div class="animated-bg">
        <div class="floating-heart" style="left: 10%; animation-delay: 0s;">💖</div>
        <div class="floating-heart" style="left: 20%; animation-delay: 2s;">💕</div>
        <div class="floating-heart" style="left: 70%; animation-delay: 1s;">💗</div>
        <div class="floating-heart" style="left: 80%; animation-delay: 3s;">💝</div>
        <div class="sparkle" style="left: 15%; top: 20%; animation-delay: 1s;">✨</div>
        <div class="sparkle" style="left: 85%; top: 30%; animation-delay: 0.5s;">⭐</div>
        <div class="sparkle" style="left: 30%; top: 70%; animation-delay: 2.5s;">✨</div>
        <div class="sparkle" style="left: 75%; top: 80%; animation-delay: 1.5s;">⭐</div>
    </div>

    <!-- Main teddy bear background -->
    <div class="teddy-bear-bg">🧸</div>

    <!-- Main container -->
    <div class="container">
        <audio id="backgroundMusic" loop autoplay>
            <source src="music.mp3" type="audio/mpeg">
            Your browser does not support the audio element.
        </audio>
        <header>
            <h1 class="main-title">Senin için küçük bir sürpriz 💕</h1>
            <p class="subtitle">Tıkla ve sürprize hazır ol! 🌸</p>
            <!-- Music control button -->
            <button class="music-btn" id="musicBtn" onclick="toggleMusic()">
                <span id="musicIcon">🎵</span>
                <span id="musicText">Müziği Başlat</span>
            </button>
        </header>

        <!-- Interactive Q&A System -->
        <div class="qa-system" id="qaSystem">
            <!-- Initial buttons -->
            <div class="buttons-container" id="mainButtons">
                <!-- Button 1: Start Q&A -->
                <button class="cute-button mad-button" onclick="startQAFlow()">
                    <span class="button-icon">💭</span>
                    <span class="button-text">Küs müyüz?</span>
                </button>

                <!-- Button 2: Love messages -->
                <button class="cute-button love-button" onclick="showLoveMessage()">
                    <span class="button-icon">💖</span>
                    <span class="button-text">Seni Seviyorum</span>
                </button>

                <!-- Button 3: Hug -->
                <button class="cute-button hug-button" onclick="showHugMessage()">
                    <span class="button-icon">🤗</span>
                    <span class="button-text">Sarıl</span>
                </button>

                <!-- Button 4: Fun activities -->
                <button class="cute-button smile-button" onclick="showFunActivities()">
                    <span class="button-icon">🎮</span>
                    <span class="button-text">Eğlenceli Aktiviteler</span>
                </button>
            </div>

            <!-- Q&A Interface -->
            <div class="qa-interface" id="qaInterface" style="display: none;">
                <div class="question-container">
                    <h3 id="questionText">Küs müyüz?</h3>
                    <div class="answer-buttons">
                        <button class="answer-btn yes-btn" id="yesBtn" onclick="handleAnswer('yes')">
                            <span class="btn-icon">✅</span>
                            <span>Evet</span>
                        </button>
                        <button class="answer-btn no-btn" id="noBtn" onclick="handleAnswer('no')">
                            <span class="btn-icon">❌</span>
                            <span>Hayır</span>
                        </button>
                    </div>
                </div>
                <button class="back-btn" onclick="goBackToMain()">
                    <span>🔙 Ana Menü</span>
                </button>
            </div>

            <!-- Fun Activities Interface -->
            <div class="fun-activities" id="funActivities" style="display: none;">
                <div class="activities-grid">
                    <button class="activity-btn" onclick="playKissGame()">
                        <span class="activity-icon">😘</span>
                        <span>Öpücük Oyunu</span>
                    </button>
                    <button class="activity-btn" onclick="showCompliments()">
                        <span class="activity-icon">🌟</span>
                        <span>Günlük Iltifat</span>
                    </button>
                    <button class="activity-btn" onclick="memoryGame()">
                        <span class="activity-icon">🧠</span>
                        <span>Anı Kutusu</span>
                    </button>
                    <button class="activity-btn" onclick="wishMaker()">
                        <span class="activity-icon">⭐</span>
                        <span>Dilek Tut</span>
                    </button>
                </div>
                <button class="back-btn" onclick="goBackToMain()">
                    <span>🔙 Ana Menü</span>
                </button>
            </div>
        </div>

        <!-- Message display area -->
        <div class="message-display" id="messageDisplay">
            <p id="messageText">Bir butona tıkla ve sürprizi gör! 🌈</p>
        </div>

        <!-- Special popup for hug -->
        <div class="hug-popup" id="hugPopup">
            <div class="hug-content">
                <div class="big-teddy">🧸</div>
                <p>Sımsıkı sarıldım sana! 🤗💕</p>
                <button onclick="closeHugPopup()">❌</button>
            </div>
        </div>
    </div>

    <!-- Confetti container -->
    <div class="confetti-container" id="confettiContainer"></div>

    <script src="script.js"></script>
</body>

</html>
